<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เค้าขอโทษน้า 💗</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Tahoma", sans-serif;
  background: linear-gradient(145deg,#ffe3ed,#ffd1e6,#fce4ff);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #8d4267;
}

.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  bottom: -40px;
  animation: floatUp linear infinite;
  opacity: .6;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

.card {
  width: 90%;
  max-width: 390px;
  background: rgba(255,255,255,.83);
  border-radius: 30px;
  padding: 28px 20px;
  text-align: center;
  box-shadow: 0 12px 40px #d77ca744;
  position: relative;
  z-index: 2;
  border: 2px solid white;
}

.character {
  font-size: 105px;
  display: inline-block;
  animation: bounce 1.5s infinite ease-in-out;
  filter: drop-shadow(0 7px 5px #e99bb566);
}

.character img {
  width: 180px;
  height: 180px;
  max-width: 100%;
  object-fit: contain;
  display: block;
}

@keyframes bounce {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
}

h2 {
  font-size: 24px;
  margin: 12px 0;
  color: #e56b9c;
}

.message {
  font-size: 16px;
  line-height: 1.9;
  margin: 15px 0 22px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.final-note {
  width: 100%;
  padding: 15px 12px;
  border-radius: 50px;
  background: linear-gradient(90deg,#ff78a9,#f3a0c5);
  color: white;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.5;
  box-shadow: 0 5px 12px #f28bb455;
  animation: fadeIn .45s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.94);
}

.yes {
  color: white;
  background: linear-gradient(90deg,#ff78a9,#f3a0c5);
  box-shadow: 0 5px 12px #f28bb455;
}

.no {
  background: #fff0f5;
  color: #d4779b;
  border: 1px solid #ffc6dc;
}

.small {
  font-size: 12px;
  color: #c78ba7;
  margin-top: 20px;
}

#result {
  display: none;
}

/* ข้อความประจำมุมขวาล่าง */
.signature {
  position: fixed;
  right: 12px;
  bottom: 10px;
  z-index: 30;
  font-size: 16px;
  font-weight: bold;
  color: #e56b9c;
  text-shadow: 0 1px 4px #fff;
  pointer-events: none;
}

/* ปุ่มเชอะที่เลื่อนหนีอย่างนุ่มนวล */
.no.running-away {
  position: fixed;
  z-index: 20;
  margin: 0;
  transition: left .6s cubic-bezier(.22,.8,.25,1), top .6s cubic-bezier(.22,.8,.25,1), transform .2s;
  will-change: left, top;
}

.sparkle {
  position: fixed;
  pointer-events: none;
  font-size: 25px;
  animation: pop 1s forwards;
  z-index: 10;
}

@keyframes pop {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: translateY(-120px) scale(1.8); opacity: 0; }
}
</style>
</head>

function handleNoButton(){
  const button = document.getElementById("noButton");
  if(noButtonFinished) return;

  // ครั้งที่ 4: หยุดหนีและแสดงคำถาม
  if(noButtonEscapeCount === 3 && !noButtonQuestionShown){
    noButtonQuestionShown = true;
    button.classList.remove("running-away");
    button.style.left = "";
    button.style.top = "";
    button.style.width = "100%";
    button.style.maxWidth = "";
    button.style.whiteSpace = "normal";
    button.textContent = "จะไปจริงๆหรอ🥹";
    return;
  }

  // เมื่อกดคำถาม: เปลี่ยน GIF และแสดงข้อความสุดท้าย โดยซ่อนตัวเลือกทั้งหมด
  if(noButtonQuestionShown){
    noButtonFinished = true;
    const character = document.getElementById("mainCharacter");
    character.innerHTML = '<img src="' + finalReactionGif + '" alt="น้องแมวร้องไห้">';
    // ซ่อนข้อความขอโทษด้านบนเมื่อเข้าสู่หน้าสุดท้าย
    document.querySelector("#main h2").style.display = "none";
    document.querySelector("#main .message").style.display = "none";

    const buttons = document.querySelector(".buttons");
    buttons.innerHTML = '<div class="final-note">โอเค ตามที่เธอสบายใจเลยนะ😊</div>';
    return;
  }

  // ครั้งที่ 1–3: ยึดตำแหน่งปัจจุบันก่อน แล้วค่อยเลื่อนไปตำแหน่งสุ่ม
  noButtonEscapeCount++;
  const rect = button.getBoundingClientRect();
  const margin = 12;
  const width = Math.min(rect.width, Math.max(120, window.innerWidth - margin * 2));
  const height = rect.height;

  button.classList.add("running-away");
  button.style.width = width + "px";
  button.style.maxWidth = "calc(100vw - 24px)";
  button.style.left = rect.left + "px";
  button.style.top = rect.top + "px";

  const maxLeft = Math.max(margin, window.innerWidth - width - margin);
  const maxTop = Math.max(margin, window.innerHeight - height - margin);
  let nextLeft = margin + Math.random() * Math.max(0, maxLeft - margin);
  let nextTop = margin + Math.random() * Math.max(0, maxTop - margin);

  // เลี่ยงตำแหน่งเดิม เพื่อให้เห็นการเคลื่อนที่ชัดเจน
  if(Math.abs(nextLeft - rect.left) < 70 && Math.abs(nextTop - rect.top) < 70){
    nextLeft = rect.left < window.innerWidth / 2 ? maxLeft : margin;
    nextTop = rect.top < window.innerHeight / 2 ? maxTop : margin;
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      button.style.left = nextLeft + "px";
      button.style.top = nextTop + "px";
    });
  });
}
